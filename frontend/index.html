<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/aerointel-logo-256.png" />
    <link rel="apple-touch-icon" href="/brand/aerointel-logo-256.png" />
    <title>AeroIntel — Smart Inspection. Safer Skies.</title>

    <!-- Fonts: Plus Jakarta Sans (headlines/body) + Inter (captions/data) — from Stitch design -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind via CDN — as Stitch generated (decision: keep CDN, no build step) -->

      tailwind.config = {

              "surface-container-highest": "#d1e4ff",
              "on-surface": "#041d33",

              "on-background": "#041d33",
