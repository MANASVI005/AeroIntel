<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_6 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_6" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_6');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js interactive 3D aircraft model scene
const container = document.getElementById('aircraft-canvas-container') || document.querySelector('.aircraft-3d-container') || (typeof container !== 'undefined' ? container : document.body);

const width = container.clientWidth || window.innerWidth * 0.45 || 600;
const height = container.clientHeight || 520;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 8, 24);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(width, height);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xdff0ff, 1.2);
dirLight.position.set(15, 25, 20);
dirLight.castShadow = true;
scene.add(dirLight);

const blueRimLight = new THREE.DirectionalLight(0x2c6ecb, 0.7);
blueRimLight.position.set(-15, -10, -10);
scene.add(blueRimLight);

// Aircraft Group
const airplane = new THREE.Group();

// Materials matching AeroIntel light palette
const bodyMat = new THREE.MeshPhongMaterial({
  color: 0xffffff,
  specular: 0x90caf9,
  shininess: 40,
  flatShading: false
});

const wingMat = new THREE.MeshPhongMaterial({
  color: 0xf0f4f9,
  specular: 0x64b5f6,
  shininess: 50
});

const accentBlueMat = new THREE.MeshPhongMaterial({
  color: 0x1b78b4,
  specular: 0xffffff,
  shininess: 70
});

const glassMat = new THREE.MeshPhongMaterial({
  color: 0x1a365d,
  specular: 0xffffff,
  shininess: 90,
  transparent: true,
  opacity: 0.85
});

const engineMat = new THREE.MeshPhongMaterial({
  color: 0xcfd8dc,
  specular: 0xffffff,
  shininess: 60
});

// Fuselage (main cabin)
const fuselageGeo = new THREE.CylinderGeometry(1.2, 0.9, 13, 32);
fuselageGeo.rotateZ(Math.PI / 2);
const fuselage = new THREE.Mesh(fuselageGeo, bodyMat);
airplane.add(fuselage);

// Cockpit nose cone
const noseGeo = new THREE.ConeGeometry(1.2, 3.2, 32);
noseGeo.rotateZ(-Math.PI / 2);
const nose = new THREE.Mesh(noseGeo, bodyMat);
nose.position.x = 8.1;
airplane.add(nose);

// Cockpit windshield
const cockpitGeo = new THREE.SphereGeometry(1.1, 16, 16, 0, Math.PI, 0, Math.PI / 2.5);
const cockpit = new THREE.Mesh(cockpitGeo, glassMat);
cockpit.rotation.z = -Math.PI / 3;
cockpit.rotation.y = Math.PI / 2;
cockpit.position.set(7.2, 0.45, 0);
cockpit.scale.set(0.9, 0.75, 1.1);
airplane.add(cockpit);

// Tail cone
const tailConeGeo = new THREE.ConeGeometry(0.9, 4.2, 32);
tailConeGeo.rotateZ(Math.PI / 2);
const tailCone = new THREE.Mesh(tailConeGeo, bodyMat);
tailCone.position.x = -8.6;
airplane.add(tailCone);

// Main Wings (Swept-back aerodynamic passenger jet wings)
const wingShape = new THREE.Shape();
wingShape.moveTo(0, 0);
wingShape.lineTo(-2.2, 11);
wingShape.lineTo(-3.6, 10.8);
wingShape.lineTo(-1.8, 0);
wingShape.closePath();

const extrudeSettings = { depth: 0.18, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.08, bevelThickness: 0.08 };
const wingGeo = new THREE.ExtrudeGeometry(wingShape, extrudeSettings);

// Right Wing
const rightWing = new THREE.Mesh(wingGeo, wingMat);
rightWing.rotation.x = Math.PI / 2;
rightWing.rotation.z = -Math.PI / 2;
rightWing.rotation.y = 0.05; // slight dihedral
rightWing.position.set(2.5, -0.15, 0);
airplane.add(rightWing);

// Left Wing
const leftWing = new THREE.Mesh(wingGeo, wingMat);
leftWing.rotation.x = -Math.PI / 2;
leftWing.rotation.z = -Math.PI / 2;
leftWing.rotation.y = -0.05;
leftWing.position.set(2.5, -0.15, 0);
airplane.add(leftWing);

// Winglet accents (AeroIntel Blue tips)
const wingletGeo = new THREE.BoxGeometry(0.8, 0.9, 0.1);
const wingletR = new THREE.Mesh(wingletGeo, accentBlueMat);
wingletR.position.set(-8.4, 0.4, 11);
airplane.add(wingletR);

const wingletL = new THREE.Mesh(wingletGeo, accentBlueMat);
wingletL.position.set(-8.4, 0.4, -11);
airplane.add(wingletL);

// Vertical Stabilizer (Tail Fin)
const finShape = new THREE.Shape();
finShape.moveTo(0, 0);
finShape.lineTo(-2.8, 4.5);
finShape.lineTo(-4.2, 4.3);
finShape.lineTo(-3.2, 0);
finShape.closePath();

const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.2, bevelEnabled: true, bevelSegments: 2, bevelSize: 0.05, bevelThickness: 0.05 });
const verticalFin = new THREE.Mesh(finGeo, accentBlueMat);
verticalFin.position.set(-7.5, 0.7, -0.1);
airplane.add(verticalFin);

// Horizontal Stabilizers
const hStabGeo = new THREE.BoxGeometry(2.4, 0.14, 7.2);
const hStab = new THREE.Mesh(hStabGeo, wingMat);
hStab.position.set(-9.8, 0.7, 0);
airplane.add(hStab);

// Jet Engines (under wings)
function createEngine(sideZ) {
  const engineGroup = new THREE.Group();
  const nacelleGeo = new THREE.CylinderGeometry(0.65, 0.6, 3.2, 24);
  nacelleGeo.rotateZ(Math.PI / 2);
  const nacelle = new THREE.Mesh(nacelleGeo, engineMat);
  engineGroup.add(nacelle);

  const intakeGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 24);
  intakeGeo.rotateZ(Math.PI / 2);
  const intake = new THREE.Mesh(intakeGeo, glassMat);
  intake.position.x = 1.5;
  engineGroup.add(intake);

  // Pylon
  const pylonGeo = new THREE.BoxGeometry(1.6, 0.8, 0.15);
  const pylon = new THREE.Mesh(pylonGeo, bodyMat);
  pylon.position.set(0, 0.6, 0);
  engineGroup.add(pylon);

  engineGroup.position.set(1.2, -1.1, sideZ);
  return engineGroup;
}

airplane.add(createEngine(4.6));
airplane.add(createEngine(-4.6));

// Subtle inspection target nodes (AI damage detection highlights)
const nodeGeo = new THREE.SphereGeometry(0.22, 16, 16);
const nodeMatCyan = new THREE.MeshBasicMaterial({ color: 0x5cc4df }); // Crack
const nodeMatAmber = new THREE.MeshBasicMaterial({ color: 0xf5c443 }); // Fastener

const inspectNode1 = new THREE.Mesh(nodeGeo, nodeMatCyan);
inspectNode1.position.set(0.5, 0.1, 4.2);
airplane.add(inspectNode1);

const inspectNode2 = new THREE.Mesh(nodeGeo, nodeMatAmber);
inspectNode2.position.set(4.0, 0.8, 0.6);
airplane.add(inspectNode2);

// Soft contact drop-shadow disc on the ground plane
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = 128;
shadowCanvas.height = 128;
const ctx = shadowCanvas.getContext('2d');
const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
gradient.addColorStop(0, 'rgba(44, 110, 203, 0.35)');
gradient.addColorStop(0.4, 'rgba(44, 110, 203, 0.15)');
gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, 128, 128);

const shadowTexture = new THREE.CanvasTexture(shadowCanvas);
const shadowGeo = new THREE.PlaneGeometry(22, 14);
const shadowMat = new THREE.MeshBasicMaterial({
  map: shadowTexture,
  transparent: true,
  opacity: 0.65,
  depthWrite: false
});
const shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -6.2;
scene.add(shadowPlane);

// Initial plane orientation: diagonal perspective for beautiful hero presentation
airplane.rotation.set(0.18, -Math.PI / 3.8, 0.12);
scene.add(airplane);

// Drag to Orbit & Interaction Logic
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };
let userRotationY = 0;
let userRotationX = 0;
let autoRotateSpeed = (2 * Math.PI) / (20 * 60); // ~20s full 360 turn

function onPointerDown(e) {
  isDragging = true;
  previousMousePosition = { x: e.clientX, y: e.clientY };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const deltaX = e.clientX - previousMousePosition.x;
  const deltaY = e.clientY - previousMousePosition.y;

  userRotationY += deltaX * 0.008;
  userRotationX = Math.max(-0.5, Math.min(0.5, userRotationX + deltaY * 0.005));

  previousMousePosition = { x: e.clientX, y: e.clientY };
}

function onPointerUp() {
  isDragging = false;
}

container.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);

// Responsive sizing
function onWindowResize() {
  const w = container.clientWidth || window.innerWidth * 0.45 || 600;
  const h = container.clientHeight || 520;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onWindowResize);

// Animation Loop
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Subtle vertical floating motion
  const floatOffset = Math.sin(elapsedTime * 1.5) * 0.35;
  airplane.position.y = floatOffset;
  shadowPlane.scale.set(1 + floatOffset * 0.08, 1 + floatOffset * 0.08, 1);

  // Gentle subtle pitch rock
  const rockRoll = Math.cos(elapsedTime * 1.2) * 0.03;

  // Auto-rotation around vertical axis + user drag
  if (!isDragging) {
    userRotationY += autoRotateSpeed;
  }

  airplane.rotation.y = userRotationY - Math.PI / 3.8;
  airplane.rotation.x = 0.18 + userRotationX + rockRoll;

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_6 -->


</body></html>
